version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - bodyclose
    - contextcheck
  exclusions:
    paths:
      - gen
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mustafaautomation/grpc-messaging-tests
  exclusions:
    paths:
      - gen
